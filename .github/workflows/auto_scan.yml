name: AI_Stock_Hunter_System

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  stock_scan_job:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 下載程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pandas>=2.0.0 numpy>=1.24.0 yfinance>=0.2.28 pandas-ta

      - name: 4. 執行 AI 選股
        run: python trading_bot.py
