name: AI_Stock_Hunter_System

on:
  schedule:
    # 台灣時間週一至週五 下午 15:30 自動執行 (UTC 07:30)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    # 允許你在 GitHub 介面上隨時點擊按鈕手動執行

jobs:
  stock_scan_job:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 下載你的程式碼
        uses: actions/checkout@v3

      - name: 2. 安裝 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. 安裝 AI 選股必要的套件
        run: |
          pip install pandas pandas_ta yfinance

      - name: 4. 執行 AI 自動選股邏輯
        run: python trading_bot.py
