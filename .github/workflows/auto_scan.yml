name: AI_Stock_Hunter_System

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  stock_scan_job:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 下載程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pandas>=2.0.0 numpy>=1.24.0 yfinance>=0.2.28 pandas-ta

      - name: 4. 執行 AI 選股
        run: python trading_bot.py

      - name: 5. 推送結果到 GitHub Issues
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const glob = require('glob');
            const path = require('path');
            
            // 取得最新的 CSV 檔案
            const reports = glob.sync('reports/stock_scan_*.csv');
            if (reports.length === 0) {
              console.log('No reports found');
              return;
            }
            
            const latest = reports.sort().pop();
            console.log(`Using report: ${latest}`);
            
            // 讀取 CSV 內容
            const csvContent = fs.readFileSync(latest, 'utf-8');
            const lines = csvContent.split('\n').filter(line => line.trim());
            
            if (lines.length <= 1) {
              console.log('No results to report');
              return;
            }
            
            // 取得掃描結果
            const resultCount = lines.length - 1;
            const csvLines = lines.slice(0, Math.min(6, lines.length));
            let tablePreview = csvLines.join('\n');
            
            // 建立 Issue
            const issueBody = `## 🤖 自動選股系統掃描結果

**掃描時間**: ${new Date().toLocaleString('zh-TW')}
**找到**: ${resultCount} 檔符合條件的股票

### 📈 結果預覽
\`\`\`
${tablePreview}
${resultCount > 5 ? '\n... 還有 ' + (resultCount - 5) + ' 筆記錄' : ''}
\`\`\`

### 📊 詳細資訊

| 項目 | 說明 |
|------|------|
| 掃描標的 | 5 檔股票 |
| 符合條件 | ${resultCount} 檔 |
| 報告檔案 | \`${path.basename(latest)}\` |
| 線上工具 | https://tailee688-tech.github.io/stock123/ |

### 🎯 訊號說明

- 🚀 **回踩發動** (3-5日短波) - 回踩MA5、KD金叉、MACD轉強、價量齊揚
- 💎 **趨勢動能** (10日波段) - 三線排列、縮量洗盤、RSI未超買
- 🔥 **成交量爆發** (當沖訊號) - 開盤跳空、量比爆發、上影線短
- ⚡ **MACD金叉** (長期趨勢) - MACD金叉、量能支撐、RSI合理區間
- 📈 **反轉突破** (低位起漲) - RSI超賣、KD超賣、量能放大

### 📋 更多資源

- 📁 CSV 報告: [reports/${path.basename(latest)}](https://github.com/${{ github.repository }}/blob/main/${latest})
- 🌐 線上分析工具: https://tailee688-tech.github.io/stock123/
- 📚 GitHub Pages: https://github.com/${{ github.repository }}/tree/main

---

**⚠️ 免責聲明**: 
本系統為技術分析輔助工具，僅供參考，不構成投資建議。交易決策應結合市場環境、資金管理及風險控制。投資有風險，請謹慎評估。
`;
            
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📊 股票掃描報告 - ' + new Date().toISOString().split('T')[0],
                body: issueBody,
                labels: ['stock-scan', 'automated']
              });
              
              console.log('✅ Issue created successfully');
            } catch (error) {
              console.error('❌ Failed to create issue:', error);
            }

      - name: 6. 上傳報告到 Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: stock_scan_reports
          path: reports/
          retention-days: 30

      - name: 7. 提交報告到 Git
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -d "reports" ] && [ "$(ls -A reports)" ]; then
            git add reports/
            git commit -m "chore: add stock scan report $(date +%Y-%m-%d)" || true
            git push
          fi
