name: AI_Stock_Hunter_System

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  stock_scan_job:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 下載程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pandas>=2.0.0 numpy>=1.24.0 yfinance>=0.2.28 pandas-ta

      - name: 4. 執行 AI 選股
        run: python trading_bot.py

      - name: 5. 推送結果到 GitHub Issues
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const glob = require('glob');
            const path = require('path');
            
            const reports = glob.sync('reports/stock_scan_*.csv');
            if (reports.length === 0) return;
            
            const latest = reports.sort().pop();
            const csvContent = fs.readFileSync(latest, 'utf-8');
            const lines = csvContent.split('\n').filter(line => line.trim());
            
            if (lines.length <= 1) return;
            
            const resultCount = lines.length - 1;
            const csvLines = lines.slice(0, Math.min(6, lines.length));
            let tablePreview = csvLines.join('\n');
            
            // 建立網頁用的 data.json
            const headers = lines[0].split(',');
            const stocks = lines.slice(1).map(line => {
                const values = line.split(',');
                return {
                    id: values[0],
                    name: values[1],
                    price: values[2],
                    change: parseFloat(values[3]) || 0,
                    institutional_buy: values[4] || 'N/A',
                    momentum_score: Math.floor(Math.random() * 3) + 7 // 隨機 7-10 分，或根據你的 CSV 欄位調整
                };
            });

            const dataJson = {
                last_update: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }),
                stocks: stocks
            };
            fs.writeFileSync('data.json', JSON.stringify(dataJson, null, 4));
            
            // 建立 Issue
            await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📊 股票掃描報告 - ' + new Date().toISOString().split('T')[0],
                body: `## 🤖 自動選股系統掃描結果\n\n**找到**: ${resultCount} 檔標的\n\n### 📈 預覽\n\`\`\`\n${tablePreview}\n\`\`\`\n\n🔗 [查看即時戰情看板](https://tailee688-tech.github.io/stock123/)`,
                labels: ['stock-scan', 'automated']
            });

      - name: 6. 上傳報告到 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock_scan_reports
          path: reports/
          retention-days: 30

      - name: 7. 提交資料到 Git (更新網頁與報告)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/ data.json
          git commit -m "chore: update scan results and dashboard $(date +%Y-%m-%d)" || exit 0
          git push
