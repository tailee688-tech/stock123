name: 煥然戰情室 - 每日自動掃描

on:
  schedule:
    - cron: '30 0 * * *'     # 每天台灣時間早上 8:30 執行
  workflow_dispatch:         # 可以手動點擊執行

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          pip install -r requirements.txt

      - name: 執行股票掃描
        run: |
          python trading_bot.py

      - name: Commit & Push 更新後的 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "🤖 自動更新戰情資料 - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
