name: AI_Stock_Hunter_System

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  stock_scan_job:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 下載程式碼
        uses: actions/checkout@v3

      - name: 2. 安裝 Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # 升級版本以確保套件相容性

      - name: 3. 安裝套件 (使用正確名稱與順序)
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance
          pip install pandas-ta --user  # 使用 --user 模式確保路徑正確
          
      - name: 4. 執行 AI 選股
        run: python trading_bot.py
