<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>煥然戰情室 | 法人量動能每日掃描</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Noto Sans TC', sans-serif; }
        .stock-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid #334155; }
        .trend-up { color: #f43f5e; }
        .trend-down { color: #22c55e; }
    </style>
</head>
<body class="p-4 md:p-8">
    <header class="mb-8 border-b border-slate-700 pb-4">
        <h1 class="text-3xl font-bold">🔥 煥然戰情室</h1>
        <p id="update-time" class="text-sm text-slate-400 mt-2">最後更新：載入中...</p>
    </header>
    
    <main>
        <div id="stock-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

    <footer class="mt-12 text-center text-xs text-slate-500">
        由煥然親自開發 • 每天自動更新 • 僅供參考
    </footer>

    <script>
        async function loadStockData() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();
                
                document.getElementById('update-time').innerText = `最後更新：${data.last_update || '剛剛'}`;
                
                const container = document.getElementById('stock-list');
                container.innerHTML = '';

                data.stocks.forEach(stock => {
                    const card = `
                        <div class="stock-card rounded-2xl p-6 shadow-xl">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h2 class="text-2xl font-bold">${stock.name}</h2>
                                    <p class="text-slate-400">${stock.id}</p>
                                </div>
                                <span class="px-3 py-1 bg-blue-900/50 text-blue-300 rounded-full text-xs">${stock.category || '法人掃描'}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <p class="text-slate-400 text-xs">目前價格</p>
                                    <p class="text-3xl font-mono ${stock.change >= 0 ? 'trend-up' : 'trend-down'}">${stock.price}</p>
                                </div>
                                <div>
                                    <p class="text-slate-400 text-xs">建議買入價</p>
                                    <p class="text-2xl font-semibold text-emerald-400">${stock.suggest_buy || stock.price}</p>
                                </div>
                            </div>
                            <div class="mt-6 pt-4 border-t border-slate-700 flex justify-between">
                                <span class="text-slate-400">動能強度</span>
                                <span class="text-3xl font-bold text-yellow-400">${stock.momentum_score}/10</span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (e) {
                document.getElementById('stock-list').innerHTML = `<div class="col-span-full text-center py-20 text-red-400">資料載入失敗，請確認 data.json 已存在</div>`;
            }
        }
        loadStockData();
        setInterval(loadStockData, 300000);
    </script>
</body>
</html>
