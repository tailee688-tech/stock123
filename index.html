<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>煥然戰情室 | 法人量動能每日掃描</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Noto Sans TC', system-ui, sans-serif; 
        }
        .stock-card { 
            background: linear-gradient(145deg, #1e293b, #0f172a); 
            border: 1px solid #334155; 
        }
        .trend-up { color: #f43f5e; }
        .trend-down { color: #22c55e; }
    </style>
</head>
<body class="p-4 md:p-8">
    <header class="mb-8 border-b border-slate-700 pb-4">
        <h1 class="text-3xl font-bold tracking-tight flex items-center gap-3">
            🔥 煥然戰情室
            <span class="text-sm font-normal text-slate-400">｜法人量動能每日掃描</span>
        </h1>
        <p id="update-time" class="text-sm text-slate-400 mt-2">最後更新：載入中...</p>
    </header>
    
    <main>
        <div id="stock-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="animate-pulse text-slate-400 text-center col-span-full py-20">AI 正在掃描市場...</div>
        </div>
    </main>

    <footer class="mt-12 text-center text-xs text-slate-500">
        由煥然親自開發 • 每天 08:30 自動更新 • 僅供參考 • 非投資建議
    </footer>

    <script>
        async function loadStockData() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();
               
                const container = document.getElementById('stock-list');
                const timeEl = document.getElementById('update-time');
               
                timeEl.innerText = `最後更新：${data.last_update || '剛剛'}`;
                container.innerHTML = '';
                
                if (data.stocks && data.stocks.length > 0) {
                    data.stocks.forEach(stock => {
                        const card = `
                            <div class="stock-card rounded-2xl p-6 shadow-xl">
                                <div class="flex justify-between items-start mb-5">
                                    <div>
                                        <h2 class="text-2xl font-bold">${stock.name}</h2>
                                        <p class="text-slate-400">${stock.id}</p>
                                    </div>
                                    <span class="px-3 py-1 bg-blue-900/50 text-blue-300 rounded-full text-xs font-medium">${stock.category}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-6">
                                    <div>
                                        <p class="text-slate-400 text-xs">目前價格</p>
                                        <p class="text-3xl font-mono ${stock.change >= 0 ? 'trend-up' : 'trend-down'}">${stock.price}</p>
                                    </div>
                                    <div>
                                        <p class="text-slate-400 text-xs">法人買超</p>
                                        <p class="text-2xl font-semibold text-blue-400">${stock.institutional_buy} 張</p>
                                    </div>
                                </div>
                                <div class="mt-6 pt-4 border-t border-slate-700 flex justify-between items-center">
                                    <span class="text-slate-400 text-sm">動能強度</span>
                                    <span class="text-2xl font-bold text-yellow-400">${stock.momentum_score}/10</span>
                                </div>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = '<div class="col-span-full text-center text-slate-400 py-12">今日暫無強訊號標的</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('stock-list').innerHTML = '<div class="col-span-full text-red-400 text-center py-12">資料載入失敗<br>請稍後重新整理</div>';
            }
        }

        loadStockData();
        setInterval(loadStockData, 300000);
    </script>
</body>
</html>
